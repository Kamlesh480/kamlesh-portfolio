<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Simplified KC favicon: bolder strokes, no grain/echo passes (they read
       as noise below 32px), on a paper tile so the mark stays visible on both
       light and dark browser tabs. Master mark: /public/brand/kc-mark.svg -->
  <defs>
    <filter id="fw" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.06" numOctaves="2" seed="7" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="100" height="100" rx="20" fill="#e8e4da"/>
  <g fill="none" stroke="#161410" stroke-linecap="round" stroke-linejoin="round" filter="url(#fw)">
    <path d="M 27 18 C 25.5 35, 26.5 61, 24.5 82" stroke-width="10"/>
    <path d="M 53 20 C 45 30, 39 38, 27.5 50" stroke-width="9.5"/>
    <path d="M 30 48 C 39 58, 48 70, 56 82" stroke-width="10"/>
    <path d="M 84 28 C 74 14, 60 21, 58 40 C 56 54, 57 64, 61 74 C 67 88, 81 83, 86 70" stroke-width="10"/>
  </g>
</svg>
